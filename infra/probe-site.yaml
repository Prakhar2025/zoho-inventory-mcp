AWSTemplateFormatVersion: "2010-09-09"
Description: >
  "Zoho Inventory MCP console hosting: static console on S3, FastAPI backend via
  Mangum on Lambda behind API Gateway and CloudFront. Uses the antares-dev
  pattern proven live on this account (public-read S3 origin, REST API proxy,
  manual API Gateway restage; anonymous Lambda function URLs are blocked on
  this account, so no function URLs)."


Resources:
  ConsoleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "zohomcp-dev-console-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  ConsoleBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConsoleBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadConsoleObjects
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${ConsoleBucket.Arn}/*"

  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: zohomcp-dev-index-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for directory roots (S3 REST origin does not).
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith("/")) {
            request.uri = uri + "index.html";
          } else if (!uri.split("/").pop().includes(".")) {
            request.uri = uri + "/index.html";
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Zoho Inventory MCP console
        Enabled: true
        HttpVersion: http2
        DefaultRootObject: index.html
        Origins:
          - Id: site-origin
            DomainName: !GetAtt ConsoleBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors: []
        Restrictions:
          GeoRestriction:
            RestrictionType: none
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  PublicUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  ConsoleBucketName:
    Value: !Ref ConsoleBucket
