name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project, dev, and console dependencies
        run: pip install -e ".[dev,console]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
